# kitty.conf — macOS 메인 터미널 / 한글 가독성 우선
# 적용: Cmd+Ctrl+, (reload) 또는 kitty 재시작

# ─────────────────────────────────────────────
# 폰트 — 한글 가독성
# ─────────────────────────────────────────────
# D2Coding: 한글 글자폭이 ASCII의 정확히 2배 → 터미널 열 정렬이 깨지지 않음.
# Nerd Font Mono 변형이라 아이콘(powerline/devicon)도 1셀에 들어감.
font_family      D2KodingLigature Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        15.0

# 한글 자소(받침)가 셀 위아래로 눌리지 않도록 행간 확보
modify_font cell_height 128%
modify_font underline_position 2

# macOS 렌더링 보정 (gamma contrast). 글자가 얇아 보이면 1.9 45로.
text_composition_strategy 1.7 30

# 커서가 올라간 곳만 리거처 해제 (편집 중 실제 글자 확인용)
disable_ligatures cursor

# ─────────────────────────────────────────────
# 커서 / 스크롤백
# ─────────────────────────────────────────────
cursor_shape                  block
cursor_blink_interval         0
scrollback_lines              100000
scrollback_pager_history_size 8
wheel_scroll_multiplier       4.0

# ─────────────────────────────────────────────
# 성능 (Apple Silicon / 고주사율)
# ─────────────────────────────────────────────
repaint_delay   8
input_delay     1
sync_to_monitor yes

# ─────────────────────────────────────────────
# URL / 마우스
# ─────────────────────────────────────────────
url_style             curly
detect_urls           yes
copy_on_select        no
strip_trailing_spaces smart
mouse_hide_wait       2.0

# ─────────────────────────────────────────────
# 창 / 탭
# ─────────────────────────────────────────────
remember_window_size    yes
window_padding_width    10 12
hide_window_decorations titlebar-only
confirm_os_window_close 0
enabled_layouts         splits:split_axis=horizontal,stack,tall,fat

tab_bar_edge          top
tab_bar_style         powerline
tab_powerline_style   slanted
tab_title_template    "{index}: {title}"
active_tab_font_style bold

# ─────────────────────────────────────────────
# macOS
# ─────────────────────────────────────────────
macos_option_as_alt                yes
macos_quit_when_last_window_closed yes
macos_show_window_title_in         window
macos_traditional_fullscreen       no

# ─────────────────────────────────────────────
# 원격 제어 (kitty @ ls, load-config 등)
# ─────────────────────────────────────────────
allow_remote_control socket-only
listen_on            unix:/tmp/kitty-{kitty_pid}

# ─────────────────────────────────────────────
# 키맵
# ─────────────────────────────────────────────
map cmd+d          launch --location=vsplit --cwd=current
map cmd+shift+d    launch --location=hsplit --cwd=current
map cmd+w          close_window
map cmd+enter      toggle_layout stack
map cmd+alt+left   neighboring_window left
map cmd+alt+right  neighboring_window right
map cmd+alt+up     neighboring_window up
map cmd+alt+down   neighboring_window down
map cmd+t          new_tab_with_cwd
map cmd+k          combine : clear_terminal scrollback active : send_text normal,application \x0c
map cmd+f          show_scrollback
map cmd+0          change_font_size all 0
map cmd+ctrl+comma load_config_file

# ─────────────────────────────────────────────
# 색 (Tokyo Night — 대비 ~11:1, 한글 획이 뭉개지지 않는 조합)
# ─────────────────────────────────────────────
foreground           #c0caf5
background           #1a1b26
selection_foreground #1a1b26
selection_background #7aa2f7
cursor               #c0caf5
cursor_text_color    #1a1b26
url_color            #73daca

active_tab_foreground   #1a1b26
active_tab_background   #7aa2f7
inactive_tab_foreground #545c7e
inactive_tab_background #292e42

active_border_color   #7aa2f7
inactive_border_color #292e42

color0  #15161e
color8  #414868
color1  #f7768e
color9  #f7768e
color2  #9ece6a
color10 #9ece6a
color3  #e0af68
color11 #e0af68
color4  #7aa2f7
color12 #7aa2f7
color5  #bb9af7
color13 #bb9af7
color6  #7dcfff
color14 #7dcfff
color7  #a9b1d6
color15 #c0caf5
