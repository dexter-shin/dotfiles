# ── Terminal & Color ─────────────────────────────────────
set -g default-terminal "tmux-256color"

# Ghostty terminal-features (tmux 3.2+)
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",xterm-ghostty:usstyle"
set -as terminal-features ",xterm-ghostty:clipboard"
set -as terminal-features ",xterm-ghostty:ccolour"
set -as terminal-features ",xterm-ghostty:cstyle"
set -as terminal-features ",xterm-ghostty:focus"
set -as terminal-features ",xterm-ghostty:title"
set -as terminal-features ",xterm-ghostty:strikethrough"

# Focus events (vim autoread, Claude Code UI)
set -g focus-events on

# Extended keys (Ghostty fullkbd 활용)
set -g extended-keys on
set -g extended-keys-format xterm

# ── Prefix ──────────────────────────────────────────────
unbind C-Space
set -g prefix C-Space
bind C-Space send-prefix

# ── Mouse & Input ───────────────────────────────────────
set -g mouse on

# ── History ─────────────────────────────────────────────
set -g history-limit 50000

# ── Window Management ──────────────────────────────────
set -g renumber-windows on
setw -g aggressive-resize on

bind Space last-window
bind-key b switch-client -l

# scratch notes
bind-key h split-window -h "nvim ~/scratch/notes.md"

# Resizing
bind -r C-j resize-pane -D 15
bind -r C-k resize-pane -U 15
bind -r C-h resize-pane -L 15
bind -r C-l resize-pane -R 15

# Persist path in new windows/splits
bind c new-window -c "#{pane_current_path}"
bind-key "|" split-window -h -c "#{pane_current_path}"
bind-key "\\" split-window -fh -c "#{pane_current_path}"
bind-key "-" split-window -v -c "#{pane_current_path}"
bind-key "_" split-window -fv -c "#{pane_current_path}"

# Mark jumping
bind \` switch-client -t'{marked}'

# ── synchronize-panes 토글 (멀티노드 배치 명령) ─────────
bind-key S set-window-option synchronize-panes \; \
  display-message "synchronize-panes #{?pane_synchronized,ON,OFF}"

# ── Plugins ─────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# catppuccin theme
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavour "mocha"

# Left side of status bar
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"

set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"

set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"

set -g @catppuccin_status_modules "application session battery date_time host"
set -g @catppuccin_status_left_separator  ""
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_right_separator_inverse "yes"
set -g @catppuccin_status_fill "all"
set -g @catppuccin_status_connect_separator "no"

# Battery
set -g @plugin 'tmux-plugins/tmux-battery'

# Session save/restore
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'

set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# Initialize TPM (must be last). TPM itself comes from the Homebrew tpm formula.
run '/opt/homebrew/opt/tpm/share/tpm/tpm'
# On first start, install the plugins above and load them right away
if "test ! -d ~/.tmux/plugins/tmux-sensible" \
  "run '/opt/homebrew/opt/tpm/share/tpm/bin/install_plugins && /opt/homebrew/opt/tpm/share/tpm/tpm'"

# Transparent statusbar background
set -g status-style "bg=default"
